<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121815">
<title>JAI Conclave 2026 — Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=1.4.1">
</head>
<body>

<!-- Top Navigation Bar -->
<header id="statusBar" class="status-bar hidden">
  <div class="status-left">
    <span id="volunteerName" class="volunteer-tag">—</span>
    <div class="status-cp-row">
      <span id="checkpointName" class="checkpoint-tag">—</span>
      <button id="changeCpBtn" class="chip-btn" type="button">Switch</button>
    </div>
  </div>
  <div class="status-right">
    <span id="scanCounter" class="scan-counter-badge" title="Scans completed this session">✓ 0</span>
    <span id="pendingBadge" class="pending-badge hidden">0</span>
    <span id="connDot" class="conn-dot online" title="Online"></span>
    <button id="logoutBtn" class="link-btn" type="button">Logout</button>
  </div>
</header>

<main id="app">

  <!-- LOGIN VIEW -->
  <section id="view-login" class="view">
    <div class="login-card">
      <div class="brand-tag">JAI CONCLAVE 2026</div>
      <h1 class="brand-title">Volunteer Login</h1>
      <p class="brand-sub">Scan participant badges & verify check-ins</p>

      <form id="loginForm" autocomplete="off">
        <div class="field-group">
          <label class="field-label" for="volunteerId">Volunteer ID</label>
          <input id="volunteerId" name="volunteerId" type="text" inputmode="text"
                 placeholder="VOL-01" autocomplete="off" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="pin">PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*"
                 maxlength="6" placeholder="••••" autocomplete="off" required>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">Sign In & Scan</button>

        <div id="loginErrorBox" class="error-box hidden">
          <p id="loginError" class="error-text"></p>
          <button type="button" id="resetCacheBtn" class="btn-reset">Clear Cache & Refresh</button>
        </div>
      </form>
    </div>
  </section>

    <!-- VIEW: CHECKPOINT SELECT -->
    <section id="view-checkpoint" class="view hidden">
      <div class="view-header">
        <h2 class="view-title">Select Checkpoint</h2>
      </div>
      <div class="card checkpoint-card">
        <div id="checkpointList" class="checkpoint-list">
          <!-- Checkpoint buttons injected here -->
        </div>
        <button id="adminDashboardBtn" class="btn-secondary hidden" style="margin-top: 1rem; width: 100%;">📊 Open Admin Dashboard</button>
      </div>
    </section>

    <!-- VIEW: ADMIN DASHBOARD -->
    <section id="view-dashboard" class="view hidden">
      <div class="view-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 class="view-title" style="font-size: 1.25rem; font-weight: 700;">Admin Control Center</h2>
        <button id="closeDashboardBtn" class="chip-btn" style="padding: 6px 14px; font-size: 12px;">Close</button>
      </div>

      <!-- Dashboard Tabs -->
      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <button id="tabDashStatsBtn" class="btn-primary" style="flex: 1; padding: 8px; font-size: 13px; font-weight: 600;">📊 Live Stats</button>
        <button id="tabDashDevicesBtn" class="btn-secondary" style="flex: 1; padding: 8px; font-size: 13px; font-weight: 600;">📱 Device Manager</button>
      </div>

      <!-- Stats Panel -->
      <div id="dashStatsPanel">
        <div class="card" style="margin-bottom: 12px; background: var(--surface); padding: 14px; border-radius: var(--radius); border: 1px solid var(--border);">
          <div style="font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">Total Expected Participants</div>
          <div id="dashTotalExpected" style="font-size: 2rem; font-weight: 800; color: var(--accent); margin-top: 4px;">--</div>
        </div>
        <div id="dashMetricsGrid" class="checkpoint-list">
          <!-- Dynamic Checkpoint metric cards -->
        </div>
        <div style="text-align: center; margin-top: 14px; font-size: 11.5px; color: var(--text-dim);">
          Auto-updating every 30s. Last update: <span id="dashLastUpdate">--</span>
        </div>
      </div>

      <!-- Device Manager Panel -->
      <div id="dashDevicePanel" class="hidden">
        <div style="margin-bottom: 10px;">
          <input id="deviceSearchInput" type="text" placeholder="Search volunteer ID or name..." 
                 style="width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px;">
        </div>
        <div id="volunteerDeviceList" style="display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto;">
          <!-- Injected via UI.renderVolunteerDevices() -->
        </div>
      </div>
    </section>

  <!-- CLEAN SCANNER VIEW -->
  <section id="view-scanner" class="view hidden">
    <div id="qr-reader"></div>

    <div class="scanner-top-bar">
      <button id="torchToggleBtn" class="btn-torch hidden" type="button" aria-label="Toggle Flashlight">
        <span class="torch-icon">🔦</span>
        <span id="torchLabel" class="torch-label">Torch</span>
      </button>
    </div>
    <div class="scanner-bottom-bar">
      <p class="scan-hint">Point camera at QR code</p>
      <button id="manualEntryBtn" class="btn-manual" type="button">Enter ID Manually</button>
    </div>
  </section>

  <!-- RESULT OVERLAY -->
  <section id="resultOverlay" class="result-overlay hidden">
    <div class="result-card">
      <div id="resultIcon" class="result-icon"></div>
      <h2 id="resultTitle" class="result-title"></h2>
      <p id="resultName" class="result-name"></p>
      <p id="resultId" class="result-id"></p>
      
      <div class="result-meta-grid">
        <div class="meta-item" id="metaTypeGroup">
          <span class="meta-label">Type</span>
          <span id="resultType" class="meta-value"></span>
        </div>
        <div class="meta-item hidden" id="metaAccGroup">
          <span class="meta-label">Room</span>
          <span id="resultAcc" class="meta-value"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Checkpoint</span>
          <span id="resultCheckpoint" class="meta-value"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label" id="resultTimeLabel">Time</span>
          <span id="resultTime" class="meta-value"></span>
        </div>
      </div>

      <button id="scanNextBtn" class="btn-primary result-next-btn" type="button">Ready for Next Scan</button>
    </div>
  </section>

  <!-- MANUAL ENTRY MODAL -->
  <section id="manualEntryModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 class="modal-title">Manual Badge Check-in</h3>
      <input id="manualIdInput" class="modal-input" type="text" placeholder="JAI-26-000001" autocomplete="off">
      <div class="modal-actions">
        <button id="manualCancelBtn" class="btn-secondary" type="button">Cancel</button>
        <button id="manualSubmitBtn" class="btn-primary" type="button">Submit</button>
      </div>
    </div>
  </section>

</main>

<!-- Scripts -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/config.js?v=1.4.1"></script>
<script src="js/offlineQueue.js?v=1.4.1"></script>
<script src="js/api.js?v=1.4.1"></script>
<script src="js/auth.js?v=1.4.1"></script>
<script src="js/scanner.js?v=1.4.1"></script>
<script src="js/ui.js?v=1.4.1"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    UI.init();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js?v=1.4.1').catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          navigator.serviceWorker.ready.then(r => r.update()).catch(() => {});
        }
      });
    }
  });
</script>
</body>
</html>
