<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111815">
<title>JAI Conclave 2026 — Scanner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=1.0.4">
</head>
<body>

<!-- Top status bar: visible on checkpoint + scanner views -->
<header id="statusBar" class="status-bar hidden">
  <div class="status-left">
    <span id="volunteerName" class="status-name">—</span>
    <div class="status-cp-row">
      <span id="checkpointName" class="status-checkpoint">—</span>
      <button id="changeCpBtn" class="switch-cp-btn" title="Switch checkpoint">Switch</button>
    </div>
  </div>
  <div class="status-right">
    <span id="pendingBadge" class="pending-badge hidden">0</span>
    <span id="connDot" class="conn-dot online" title="Online"></span>
    <button id="logoutBtn" class="link-btn">Logout</button>
  </div>
</header>

<main id="app">

  <!-- SIMPLIFIED LOGIN VIEW -->
  <section id="view-login" class="view">
    <div class="login-card">
      <div class="brand-badge">JAI CONCLAVE 2026</div>
      <h1 class="brand">Volunteer Scanner</h1>
      <p class="brand-sub">Live Badge Check-In & Entry Verification</p>

      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <label class="field-label" for="volunteerId">Volunteer ID</label>
          <input id="volunteerId" name="volunteerId" type="text" inputmode="text"
                 placeholder="VOL-01" autocomplete="off" value="VOL-01" required>
        </div>

        <div class="input-group">
          <label class="field-label" for="pin">4-Digit PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*"
                 maxlength="4" placeholder="••••" autocomplete="off" value="1234" required>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">Sign In & Scan</button>

        <div id="loginErrorBox" class="error-box hidden">
          <p id="loginError" class="error-text"></p>
          <button type="button" id="resetCacheBtn" class="reset-cache-link">Clear Cache & Refresh App</button>
        </div>
      </form>
    </div>
  </section>

  <!-- CHECKPOINT SELECT VIEW -->
  <section id="view-checkpoint" class="view hidden">
    <div class="view-inner">
      <h2 class="view-title">Select Checkpoint</h2>
      <p class="view-subtitle">Tap where you are scanning right now:</p>
      <div id="checkpointList" class="checkpoint-list"></div>
    </div>
  </section>

  <!-- SCANNER VIEW -->
  <section id="view-scanner" class="view hidden">
    <div id="qr-reader"></div>
    <p class="scan-hint">Point camera at participant QR badge</p>
    <button id="manualEntryBtn" class="link-btn manual-entry-btn">Enter ID manually</button>
  </section>

  <!-- RESULT OVERLAY (shown on top of scanner) -->
  <section id="resultOverlay" class="result-overlay hidden">
    <div id="resultIcon" class="result-icon"></div>
    <h2 id="resultTitle" class="result-title"></h2>
    <p id="resultName" class="result-name"></p>
    <p id="resultId" class="result-id"></p>
    <div class="result-meta">
      <div>
        <span class="result-meta-label">Checkpoint</span>
        <span id="resultCheckpoint" class="result-meta-value"></span>
      </div>
      <div>
        <span class="result-meta-label" id="resultTimeLabel">Time</span>
        <span id="resultTime" class="result-meta-value"></span>
      </div>
    </div>
    <button id="scanNextBtn" class="btn-primary result-btn">Scan Next</button>
  </section>

  <!-- MANUAL ENTRY MODAL -->
  <section id="manualEntryModal" class="modal hidden">
    <div class="modal-card">
      <h3>Enter Participant ID</h3>
      <input id="manualIdInput" type="text" placeholder="JAI-26-000001" autocomplete="off">
      <div class="modal-actions">
        <button id="manualCancelBtn" class="btn-secondary">Cancel</button>
        <button id="manualSubmitBtn" class="btn-primary">Submit</button>
      </div>
    </div>
  </section>

</main>

<!-- Scripts with cache-busting version query strings -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/config.js?v=1.0.5"></script>
<script src="js/offlineQueue.js?v=1.0.5"></script>
<script src="js/api.js?v=1.0.5"></script>
<script src="js/auth.js?v=1.0.5"></script>
<script src="js/scanner.js?v=1.0.5"></script>
<script src="js/ui.js?v=1.0.5"></script>
<script>
  // Bootstrap the app once all modules are loaded.
  document.addEventListener('DOMContentLoaded', () => {
    UI.init();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js?v=1.0.5').then(reg => {
        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          if (installingWorker) {
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New update available, reload automatically to apply immediately
                window.location.reload();
              }
            };
          }
        };
      }).catch(err => {
        console.warn('Service worker registration failed:', err);
      });
    }
  });
</script>
</body>
</html>
